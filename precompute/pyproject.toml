[project]
name = "mars-ocean"
version = "0.1.0"
description = "Precompute hex volume lookup grids for the Mars Ocean map"
requires-python = ">=3.11"

[project.optional-dependencies]
mola = ["numpy", "rasterio", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mars_ocean*"]
